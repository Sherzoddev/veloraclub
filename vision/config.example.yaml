# Скопируйте этот файл в config.yaml и поправьте под свой клуб.
# Пароли и адреса камер сюда НЕ пишутся: они лежат в файле .env.

# Номер клуба в программе (не секрет).
club_id: "bb34ee5d-1f9d-4ae5-8cd7-db9ecd6eacdc"   # BILLION
timezone: Asia/Tashkent

cameras:
  # name — любое короткое имя камеры.
  # source_env — имя переменной в .env, где записан адрес потока камеры.
  #   (для проверки на записи можно вместо этого написать source: video.mp4)
  # anchor — по какой точке человека определять, у какого он стола:
  #   foot   — по ногам (камера висит сбоку или под углом), по умолчанию;
  #   center — по центру (камера строго над столом).
  - name: cam1
    source_env: CAM1_URL
    anchor: foot
    tables:
      # resource — название стола ТОЧНО как в программе
      # (python run.py --list-tables покажет названия).
      - resource: "1 Stol"
      - resource: "2 Stol"
      - resource: "3 Stol"
  # Вторая камера — ещё один блок:
  # - name: cam2
  #   source_env: CAM2_URL
  #   tables:
  #     - resource: "4 Stol"

rules:
  # Сколько человек у стола считать «играют». 1 — ловит и одиночную игру,
  # но чаще ошибается, если кто-то просто стоит рядом.
  min_people_play: 1
  # Играют столько минут, а сеанса нет -> сообщение.
  unrecorded_after_minutes: 5
  # Сеанс идёт, а у стола никого столько минут -> сообщение.
  idle_after_minutes: 15
  # Не повторять одно и то же сообщение про стол чаще, чем раз в N минут.
  alert_cooldown_minutes: 30
  # После закрытия сеанса люди ещё стоят у стола (платят, прощаются):
  # столько минут не придираемся.
  grace_after_session_minutes: 10
  # Детектор иногда на секунду «теряет» человека; столько секунд это терпим.
  gap_seconds: 20

detector:
  model: yolov8n.pt        # самая лёгкая модель, тянет и ноутбук без видеокарты
  confidence: 0.4          # выше — меньше ложных людей, но чаще пропуск
  image_size: 640
  interval_seconds: 1.0    # как часто смотреть на камеру

sessions:
  poll_seconds: 15         # как часто спрашивать программу про сеансы

camera_offline_after_seconds: 60
snapshot_dir: snapshots    # сюда сохраняются картинки отправленных сообщений
