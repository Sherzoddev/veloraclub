<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<title>Velora Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script async src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" onload="window.dispatchEvent(new Event('icons-ready'))"></script>
<style>
:root{--bg:#080c10;--surface:#111820;--line:rgba(200,220,255,.10);--text:#f2f5f8;--muted:#8d99a6;--accent:#4c9eff;--accent2:#2f7be0;--red:#ff6b6b;--green:#39efad;--amber:#ffbf4a;--safe-top:max(14px,env(safe-area-inset-top));--safe-bottom:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:auto;min-height:100dvh;padding:var(--safe-top) 16px calc(88px + var(--safe-bottom))}
.topbar{display:flex;align-items:center;gap:10px;height:52px}
.topbar h1{font-size:19px;margin:0;letter-spacing:-.3px}
.topbar .role{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,rgba(8,12,16,.2),#0c1218 25%);border-top:1px solid var(--line);padding:8px 6px var(--safe-bottom);backdrop-filter:blur(16px);z-index:20}
.tabs button{border:0;background:transparent;color:#6f7c88;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;padding:6px 2px;border-radius:10px;position:relative}
.tabs button.active{color:var(--accent)}
.tabs svg{width:20px;height:20px}
.badge{position:absolute;top:2px;right:16%;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.card{background:linear-gradient(145deg,#121a22,#0c1218);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:2px 0;color:var(--muted);font-size:12.5px;line-height:1.5}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101e}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.35)}
.btn.full{width:100%}
.section-title{font-size:20px;letter-spacing:-.4px;margin:18px 0 10px}
.empty{border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text)}
.field textarea{min-height:70px;resize:vertical}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.switch{width:44px;height:26px;border-radius:14px;background:#232f3a;position:relative;border:0}
.switch.on{background:var(--green)}
.switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch.on:after{transform:translateX(18px)}
.chat-search{width:100%;height:42px;border-radius:21px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:0 16px;font-size:13.5px;margin:2px 0 8px;outline:0}
.chat-search:focus{border-color:var(--accent)}
.thread{display:flex;align-items:center;gap:11px;padding:11px 6px;border-radius:14px;cursor:pointer;transition:background .15s}
.thread:active{background:var(--surface)}
.thread .grow{flex:1;min-width:0}
.thread .row{display:flex;align-items:baseline;gap:8px}
.thread b{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread time{font-size:11px;color:var(--muted);flex-shrink:0}
.thread small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.thread small em{font-style:normal;color:var(--accent)}
.thread.unread b,.thread.unread small{color:var(--text);font-weight:700}
.thread .count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#04101e;font-size:11px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:17px;color:#04101e;flex-shrink:0}
#app.chat-open{display:flex;flex-direction:column;height:100dvh;padding-bottom:calc(8px + var(--safe-bottom))}
.chat-head{display:flex;align-items:center;gap:11px;padding:6px 0 11px;border-bottom:1px solid var(--line)}
.chat-head .avatar{width:40px;height:40px;font-size:15px}
.chat-head .grow{flex:1;min-width:0}.chat-head b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-head small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.chat-head a{color:var(--accent);text-decoration:none}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px;padding:12px 2px 10px}
.chat-day{align-self:center;margin:10px 0 7px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted);font-size:11px;font-weight:600}
.msg{max-width:80%;padding:7px 11px 6px;border-radius:18px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;animation:msgIn .22s ease-out}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.gap{margin-top:7px}
.msg .meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:7px 0 -3px 10px;font-size:10.5px;opacity:.65;white-space:nowrap}
.msg .tick.read{color:#bfe3ff;opacity:1;font-weight:800}
.msg.pending{opacity:.65}.msg.failed{background:#3a1715;color:#ffc0bb;cursor:pointer}
.chat-note{align-self:center;margin:6px 0;padding:6px 12px;border-radius:12px;background:rgba(255,191,74,.1);color:var(--amber);font-size:11.5px;text-align:center}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:24px 18px;font-size:13px}
.chat-quick{display:flex;gap:7px;overflow-x:auto;padding:4px 0 9px;scrollbar-width:none}.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:8px 12px;font-size:12.5px}
.chat-bar{display:flex;align-items:flex-end;gap:8px;padding-top:9px;border-top:1px solid var(--line)}
.chat-bar textarea{flex:1;resize:none;height:44px;max-height:128px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:11px 16px;font:inherit;font-size:14.5px;line-height:1.4;outline:0}
.chat-bar textarea:focus{border-color:var(--accent)}
.chat-bar button{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .15s,opacity .15s}
.chat-bar button:disabled{opacity:.35}.chat-bar button:active{transform:scale(.92)}
.chat-bar button svg{width:19px;height:19px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.photo-thumb{width:100%;aspect-ratio:16/9;border-radius:12px;background:#0c1218 center/cover;border:1px solid var(--line);margin-bottom:8px;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;display:grid;place-items:center}
.skeleton{height:70px;border-radius:14px;background:linear-gradient(90deg,#0e151c,#161f28,#0e151c);background-size:200%;animation:sh 1.4s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200%}}
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:90}
.loader.hide{display:none}
.ring{width:40px;height:40px;border-radius:50%;border:3px solid #182530;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="loader" class="loader"><div class="ring"></div></div>
<div id="toast" class="toast"></div>
<script>
let tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#080c10');tg?.setBackgroundColor?.('#080c10')}catch(_){}
const params=new URLSearchParams(location.search),clubId=params.get('c')||'';
const initData=()=>window.Telegram?.WebApp?.initData||'';
const API='https://aatriitpqpwhdcehjzip.supabase.co/functions/v1/admin-webapp';
const icons=()=>window.lucide?.createIcons({attrs:{'stroke-width':1.8}});
window.addEventListener('icons-ready',icons);
const money=n=>Math.round(Number(n||0)).toLocaleString('ru-RU');
const escapeHtml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const state={tab:'home',club:null,role:null,bookings:[],threads:[],thread:null,activeCustomer:null,promos:[],resources:[]};
function toast(msg){const e=document.querySelector('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
const api=async(action,payload={})=>{
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,c:clubId,initData:initData(),payload})});
    const data=await r.json().catch(()=>({error:'network'}));
    if(!r.ok&&!data.error)data.error='network';
    return data;
  }catch(e){return {error:'network'}}
};
function topBar(title,back){return `<div class="topbar">${back?'<button class="back" onclick="'+back+'"><i data-lucide="chevron-left"></i></button>':''}<h1>${title}</h1></div>`}
function readFile(input){return new Promise((resolve,reject)=>{const f=input.files&&input.files[0];if(!f)return resolve(null);if(f.size>8*1024*1024)return reject(new Error('big'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}

async function boot(){
  if(!clubId){document.querySelector('#app').innerHTML='<div class="empty">Откройте через кнопку в боте клуба</div>';document.querySelector('#loader').classList.add('hide');return}
  const r=await api('bootstrap');
  document.querySelector('#loader').classList.add('hide');
  if(r.error){document.querySelector('#app').innerHTML=`<div class="empty"><b>Нет доступа</b><p>Откройте мини-апп из бота клуба, где у вас роль администратора.</p></div>`;return}
  state.club=r.club;state.role=r.role;state.counts=r.counts||{};
  renderTabs();
  // Opened from "💬 Весь чат" under a client's message in the bot: straight
  // into that thread.
  const chatWith=params.get('chat');
  if(chatWith&&/^[0-9a-f-]{36}$/i.test(chatWith)){state.tab='chat';return openThread(chatWith)}
  switchTab('home');
}
function renderTabs(){
  document.querySelector('#app').insertAdjacentHTML('afterbegin','');
}
function tabsHtml(){
  const c=state.counts||{};
  return `<div class="tabs">
    <button data-tab="home" class="${state.tab==='home'?'active':''}"><i data-lucide="layout-dashboard"></i><span>Обзор</span></button>
    <button data-tab="bookings" class="${state.tab==='bookings'?'active':''}"><i data-lucide="calendar-check"></i><span>Брони</span>${c.pendingBookings?`<span class="badge">${c.pendingBookings}</span>`:''}</button>
    <button data-tab="chat" class="${state.tab==='chat'?'active':''}"><i data-lucide="message-circle"></i><span>Чат</span>${c.unreadChats?`<span class="badge">${c.unreadChats}</span>`:''}</button>
    <button data-tab="promos" class="${state.tab==='promos'?'active':''}"><i data-lucide="ticket-percent"></i><span>Акции</span></button>
    <button data-tab="settings" class="${state.tab==='settings'?'active':''}"><i data-lucide="settings"></i><span>Ещё</span></button>
  </div>`;
}
function switchTab(tab){state.tab=tab;state.activeCustomer=null;stopChatPoll();document.querySelector('#app').classList.remove('chat-open');
  if(tab==='home')renderHome();
  if(tab==='bookings')renderBookings();
  if(tab==='chat')renderThreads();
  if(tab==='promos')renderPromos();
  if(tab==='settings')renderSettings();
}
function shell(inner){const app=document.querySelector('#app');app.classList.remove('chat-open');app.innerHTML=inner+tabsHtml();document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));icons()}

function renderHome(){
  const c=state.club||{};
  shell(`${topBar(c.name||'Клуб')}
    <div class="card"><h3>👋 Панель администратора</h3><p>Здесь — брони на подтверждение, чат с клиентами, акции, фото и режим работы клуба.</p></div>
    <div class="card" onclick="switchTab('bookings')"><h3>📅 Ожидают подтверждения</h3><p>${state.counts.pendingBookings||0} броней</p></div>
    <div class="card" onclick="switchTab('chat')"><h3>💬 Непрочитанные сообщения</h3><p>${state.counts.unreadChats||0} чатов</p></div>
  `);
}

async function renderBookings(){
  shell(`${topBar('Брони на подтверждение')}<div class="skeleton"></div><div class="skeleton"></div>`);
  const r=await api('bookings_pending');
  state.bookings=r.bookings||[];
  paintBookings();
}
function paintBookings(){
  const list=state.bookings;
  document.querySelector('#app').innerHTML=`${topBar('Брони на подтверждение')}${list.length?list.map(b=>`<div class="card"><h3>${escapeHtml(b.resource_name)}</h3><p>🕒 ${escapeHtml(b.when)}</p><p>👤 ${escapeHtml(b.customer_name||'Гость')}${b.customer_phone?' · '+escapeHtml(b.customer_phone):''}</p><div class="row"><button class="btn primary" onclick="confirmBooking('${b.id}')">✅ Подтвердить</button><button class="btn danger" onclick="cancelBookingAdmin('${b.id}')">✕ Отменить</button></div></div>`).join(''):'<div class="empty">Нет броней, ожидающих подтверждения</div>'}${tabsHtml()}`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));icons();
}
async function confirmBooking(id){const r=await api('booking_confirm',{id});if(r.ok){toast('Подтверждено');state.bookings=state.bookings.filter(b=>b.id!==id);state.counts.pendingBookings=state.bookings.length;paintBookings()}else toast('Не удалось')}
async function cancelBookingAdmin(id){const r=await api('booking_cancel',{id});if(r.ok){toast('Отменено');state.bookings=state.bookings.filter(b=>b.id!==id);state.counts.pendingBookings=state.bookings.length;paintBookings()}else toast('Не удалось')}

// Chat with clients: one thread per client, shared with the club bot (the
// client may be writing from Telegram or the client Mini App). The thread
// shell is painted once; polling only repaints the list, so the draft, focus
// and keyboard survive every refresh.
const QUICK_REPLIES=['Здравствуйте! Чем можем помочь?','Бронь подтверждена ✅ Ждём вас!','Стол свободен — приходите 🎱','К сожалению, сейчас всё занято 🙏','Спасибо! Ждём вас снова 💚'];
const AVATAR_COLORS=[['#4c9eff','#2f7be0'],['#39efad','#12b981'],['#ffbf4a','#f59e0b'],['#c084fc','#9333ea'],['#ff8a80','#ef4444'],['#67e8f9','#0891b2']];
function avatarStyle(seed){let h=0;for(const ch of String(seed||''))h=(h*31+ch.charCodeAt(0))>>>0;const [a,b]=AVATAR_COLORS[h%AVATAR_COLORS.length];return `background:linear-gradient(145deg,${a},${b})`}
const initial=name=>escapeHtml((String(name||'?').trim()[0]||'?').toUpperCase());
const chatTime=x=>new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(x));
function chatDay(x){const d=new Date(x),today=new Date(),y=new Date();y.setDate(today.getDate()-1);if(d.toDateString()===today.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(d)}
function threadTime(x){if(!x)return '';const d=new Date(x),today=new Date();if(d.toDateString()===today.toDateString())return chatTime(x);const y=new Date();y.setDate(today.getDate()-1);if(d.toDateString()===y.toDateString())return 'вчера';return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit'}).format(d)}

async function renderThreads(){
  shell(`${topBar('Чаты')}<div class="skeleton"></div><div class="skeleton"></div>`);
  const r=await api('chat_threads');
  if(state.tab!=='chat')return;
  state.threads=r.threads||[];
  shell(`${topBar('Чаты')}<input id="threadSearch" class="chat-search" placeholder="Поиск по имени или телефону" value="${escapeHtml(state.threadQuery||'')}"><div id="threadList"></div>`);
  const search=document.querySelector('#threadSearch');search.oninput=()=>{state.threadQuery=search.value;paintThreads()};
  paintThreads();
  stopChatPoll();state.chatPoll=setInterval(pollThreads,5000);
}
function paintThreads(){
  const box=document.querySelector('#threadList');if(!box)return;
  const q=(state.threadQuery||'').trim().toLowerCase();
  const rows=state.threads.filter(th=>!q||String(th.full_name||'').toLowerCase().includes(q)||String(th.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'\u0000'));
  box.innerHTML=rows.length?rows.map(th=>`<div class="thread ${th.unread?'unread':''}" onclick="openThread('${th.customer_id}')"><div class="avatar" style="${avatarStyle(th.customer_id)}">${initial(th.full_name)}</div><div class="grow"><div class="row"><b>${escapeHtml(th.full_name||'Клиент')}</b><time>${threadTime(th.last_at)}</time></div><div class="row"><small>${th.last_sender==='ADMIN'?'<em>Вы:</em> ':''}${escapeHtml(th.last_body||'')}</small>${th.unread?`<span class="count">${th.unread}</span>`:''}</div></div></div>`).join(''):`<div class="empty">${q?'Ничего не найдено':'Сообщений пока нет.<br><br>Клиенты пишут из приложения клуба или прямо в бот.'}</div>`;
  const unread=state.threads.filter(th=>th.unread>0).length;
  if(state.counts&&state.counts.unreadChats!==unread){state.counts.unreadChats=unread;const tab=document.querySelector('.tabs button[data-tab="chat"]');if(tab){tab.querySelector('.badge')?.remove();if(unread)tab.insertAdjacentHTML('beforeend',`<span class="badge">${unread}</span>`)}}
}
async function pollThreads(){
  if(state.tab!=='chat'||state.activeCustomer||!document.querySelector('#threadList'))return;
  if(document.hidden||state.chatBusy)return;state.chatBusy=true;
  try{const r=await api('chat_threads');if(r.threads&&JSON.stringify(r.threads)!==JSON.stringify(state.threads)){state.threads=r.threads;paintThreads()}}finally{state.chatBusy=false}
}

async function openThread(customerId){
  stopChatPoll();
  const known=(state.threads||[]).find(th=>th.customer_id===customerId);
  state.activeCustomer={id:customerId,name:known?.full_name||'Клиент',phone:known?.phone||'',hasTelegram:known?.has_telegram!==false};
  state.tab='chat';
  const app=document.querySelector('#app');
  app.classList.add('chat-open');
  app.innerHTML=`${threadHead()}<div class="skeleton" style="margin-top:12px"></div>`;icons();
  const r=await api('chat_thread',{customerId});
  if(r.error){toast('Чат не найден');state.activeCustomer=null;return switchTab('chat')}
  if(r.customer)state.activeCustomer={...state.activeCustomer,name:r.customer.name||'Клиент',phone:r.customer.phone||'',hasTelegram:r.customer.hasTelegram};
  state.thread=r.messages||[];state.threadSig=threadSig(state.thread);
  const th=(state.threads||[]).find(x=>x.customer_id===customerId);if(th)th.unread=0;
  paintThreadShell();
  state.chatPoll=setInterval(pollThread,2500);
  window.visualViewport?.addEventListener('resize',onChatViewportResize);
}
function closeThread(){state.activeCustomer=null;switchTab('chat')}
function threadHead(){
  const c=state.activeCustomer||{};
  const sub=[c.phone?`<a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a>`:'',c.hasTelegram===false?'нет Telegram — увидит в приложении':''].filter(Boolean).join(' · ')||'Клиент клуба';
  return `<div class="chat-head"><button class="back" onclick="closeThread()"><i data-lucide="chevron-left"></i></button><div class="avatar" style="${avatarStyle(c.id)}">${initial(c.name)}</div><div class="grow"><b>${escapeHtml(c.name)}</b><small>${sub}</small></div>${c.phone?`<a class="back" href="tel:${escapeHtml(c.phone)}"><i data-lucide="phone"></i></a>`:''}</div>`;
}
// The keyboard shrinking the visual viewport doesn't fire any scroll event on
// its own, so without this the newest message stayed hidden behind the
// keyboard the moment the admin tapped the reply field.
function onChatViewportResize(){const list=document.querySelector('#chatScroll');if(list)requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight})}
const threadSig=msgs=>msgs.map(m=>m.id+(m.read_at?'r':'')).join(',');
async function pollThread(){
  if(!state.activeCustomer||!document.querySelector('#chatScroll'))return stopChatPoll();
  if(document.hidden||state.chatBusy)return;state.chatBusy=true;
  try{
    const id=state.activeCustomer.id;
    const r=await api('chat_thread',{customerId:id});
    if(r.error||!r.messages||state.activeCustomer?.id!==id)return;
    const sig=threadSig(r.messages);if(sig===state.threadSig)return;
    const known=new Set(r.messages.map(m=>m.id));
    const before=(state.thread||[]).filter(m=>!m._local).length;
    // keep local drafts and anything just sent that this (older) poll didn't see yet
    const keep=(state.thread||[]).filter(m=>!known.has(m.id)&&(m._local||Date.now()-new Date(m.created_at).getTime()<20000));
    const fresh=r.messages.length>before&&r.messages[r.messages.length-1]?.sender_type==='CLIENT';
    state.thread=[...r.messages,...keep].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));state.threadSig=sig;
    paintThreadMessages(fresh?'auto':'keep');
    if(fresh)try{tg?.HapticFeedback?.impactOccurred('light')}catch(_){}
  }finally{state.chatBusy=false}
}
function stopChatPoll(){if(state.chatPoll){clearInterval(state.chatPoll);state.chatPoll=null}window.visualViewport?.removeEventListener('resize',onChatViewportResize)}
function paintThreadShell(){
  const app=document.querySelector('#app');
  app.innerHTML=`${threadHead()}<div id="chatScroll" class="chat-scroll"></div><div class="chat-quick" id="chatQuick">${QUICK_REPLIES.map(q=>`<button onclick="sendReply(this.textContent)">${escapeHtml(q)}</button>`).join('')}</div><div class="chat-bar"><textarea id="chatInput" rows="1" placeholder="Ответ клиенту…" maxlength="1000"></textarea><button id="chatSend" onclick="sendReply()" disabled><i data-lucide="send-horizontal"></i></button></div>`;
  icons();
  const input=document.querySelector('#chatInput');
  input.oninput=()=>{input.style.height='44px';input.style.height=Math.min(input.scrollHeight+2,128)+'px';const has=!!input.value.trim();document.querySelector('#chatSend').disabled=!has;document.querySelector('#chatQuick').style.display=has?'none':''};
  input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply()}};
  paintThreadMessages('bottom');
}
function paintThreadMessages(scroll='keep'){
  const list=document.querySelector('#chatScroll');if(!list)return;
  const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<90;
  const msgs=state.thread||[];
  if(!msgs.length){list.innerHTML='<div class="chat-empty">💬<br><br>Начните диалог — клиент получит сообщение в Telegram и сможет ответить прямо там.</div>';return}
  let html=state.activeCustomer?.hasTelegram===false?'<div class="chat-note">У клиента нет Telegram — ответы увидит в приложении клуба</div>':'',lastDay='',prev=null;
  for(const m of msgs){
    const day=chatDay(m.created_at);
    if(day!==lastDay){html+=`<div class="chat-day">${day}</div>`;lastDay=day;prev=null}
    const mine=m.sender_type==='ADMIN';
    const gap=prev&&prev.sender_type!==m.sender_type?' gap':'';
    const tick=mine?(m._failed?'!':m._local?'<span class="tick">◷</span>':`<span class="tick ${m.read_at?'read':''}">${m.read_at?'✓✓':'✓'}</span>`):'';
    html+=`<div class="msg ${mine?'me':'them'}${gap}${m._local&&!m._failed?' pending':''}${m._failed?' failed':''}" ${m._failed?`onclick="retryReply('${m.id}')" title="Не отправлено — нажмите, чтобы повторить"`:''}>${escapeHtml(m.body)}<span class="meta">${chatTime(m.created_at)} ${tick}</span></div>`;
    prev=m;
  }
  list.innerHTML=html;
  if(scroll==='bottom'||nearBottom)requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight});
}
async function sendReply(text){
  const input=document.querySelector('#chatInput');
  const message=String(text??input?.value??'').trim().slice(0,1000);if(!message||!state.activeCustomer)return;
  if(text===undefined&&input){input.value='';input.oninput();input.focus()}
  try{tg?.HapticFeedback?.impactOccurred('light')}catch(_){}
  const local={id:'local-'+Date.now(),sender_type:'ADMIN',body:message,created_at:new Date().toISOString(),_local:true};
  state.thread=[...(state.thread||[]),local];paintThreadMessages('bottom');
  await deliverReply(local,state.activeCustomer.id);
}
async function deliverReply(local,customerId){
  const r=await api('chat_reply',{customerId,message:local.body});
  if(state.activeCustomer?.id!==customerId)return;
  const i=(state.thread||[]).findIndex(m=>m.id===local.id);if(i<0)return;
  if(r.ok&&r.message){state.thread[i]=r.message;state.threadSig=threadSig(state.thread.filter(m=>!m._local))}
  else{state.thread[i]={...local,_failed:true};toast('Не удалось отправить — нажмите на сообщение, чтобы повторить')}
  paintThreadMessages('keep');
}
function retryReply(id){const m=(state.thread||[]).find(x=>x.id===id);if(!m||!state.activeCustomer)return;m._failed=false;paintThreadMessages('keep');deliverReply(m,state.activeCustomer.id)}

async function renderPromos(){
  shell(`${topBar('Акции')}<div class="skeleton"></div>`);
  const r=await api('promotions_list');
  state.promos=r.promotions||[];
  paintPromos();
}
function paintPromos(){
  document.querySelector('#app').innerHTML=`${topBar('Акции')}<button class="btn primary full" style="margin-bottom:12px" onclick="editPromo(null)">+ Новая акция</button>${state.promos.length?state.promos.map(p=>`<div class="card">${p.photo_url?`<div class="photo-thumb"><img src="${p.photo_url}"></div>`:''}<h3>${escapeHtml(p.title)}${p.active?'':' <span style="color:var(--muted);font-weight:400;font-size:11px">(скрыта)</span>'}</h3><p>${escapeHtml(p.body||'')}</p><div class="row"><button class="btn ghost" onclick="editPromo('${p.id}')">Изменить</button><button class="btn ${p.active?'danger':'primary'}" onclick="togglePromo('${p.id}',${!p.active})">${p.active?'Скрыть':'Показать'}</button></div></div>`).join(''):'<div class="empty">Акций пока нет</div>'}${tabsHtml()}`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));icons();
}
async function togglePromo(id,active){const r=await api('promotion_save',{id,active});if(r.ok){const p=state.promos.find(x=>x.id===id);if(p)p.active=active;paintPromos()}}
function editPromo(id){
  const p=id?state.promos.find(x=>x.id===id):null;
  document.querySelector('#app').innerHTML=`${topBar(p?'Изменить акцию':'Новая акция',"switchTab('promos')")}
    <div class="field"><label>Заголовок</label><input id="pTitle" value="${p?escapeHtml(p.title):''}" maxlength="120"></div>
    <div class="field"><label>Описание</label><textarea id="pBody" maxlength="600">${p?escapeHtml(p.body||''):''}</textarea></div>
    <div class="field"><label>Фото</label>${p&&p.photo_url?`<div class="photo-thumb"><img src="${p.photo_url}"></div>`:''}<input id="pPhoto" type="file" accept="image/*"></div>
    <button class="btn primary full" onclick="savePromo('${id||''}')">Сохранить</button>
    ${p?'<button class="btn danger full" style="margin-top:10px" id="deletePromoBtn">Удалить акцию</button>':''}
  `;icons();
  const delBtn=document.querySelector('#deletePromoBtn');if(delBtn)delBtn.onclick=()=>deletePromo(id);
}
async function savePromo(id){
  const title=document.querySelector('#pTitle').value.trim();
  const body=document.querySelector('#pBody').value.trim();
  if(!title){toast('Введите заголовок');return}
  let photoBase64=null;
  try{photoBase64=await readFile(document.querySelector('#pPhoto'))}catch(_){toast('Файл слишком большой');return}
  const r=await api('promotion_save',{id:id||undefined,title,body,photoBase64});
  if(r.ok)renderPromos();else toast('Не удалось сохранить')
}
async function deletePromo(id){const r=await api('promotion_delete',{id});if(r.ok)renderPromos();else toast('Не удалось удалить')}

async function renderResourcesInline(){
  const r=await api('resources_list');
  state.resources=r.resources||[];
  return state.resources.map(res=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">${escapeHtml(res.name)}</h3></div>${res.photo_url?`<div class="photo-thumb"><img src="${res.photo_url}"></div>`:'<div class="photo-thumb">Нет фото</div>'}<input type="file" accept="image/*" onchange="uploadResourcePhoto('${res.id}',this)"></div>`).join('');
}
async function uploadResourcePhoto(id,input){
  let photoBase64=null;
  try{photoBase64=await readFile(input)}catch(_){toast('Файл слишком большой');return}
  if(!photoBase64)return;
  toast('Загружаем…');
  const r=await api('resource_set_photo',{id,photoBase64});
  if(r.ok){toast('Фото обновлено');renderSettings()}else toast('Не удалось загрузить')
}

async function renderSettings(){
  shell(`${topBar('Настройки и фото')}<div class="skeleton"></div>`);
  const r=await api('settings_get');
  state.settings=r.settings||{};
  const s=state.settings;
  const resourcesHtml=await renderResourcesInline();
  document.querySelector('#app').innerHTML=`${topBar('Настройки и фото')}
    <div class="section-title" style="margin-top:2px">Тексты</div>
    <div class="field"><label>Название клуба</label><input id="sName" value="${escapeHtml(s.name||'')}"></div>
    <div class="field"><label>Телефон</label><input id="sPhone" value="${escapeHtml(s.phone||'')}"></div>
    <div class="field"><label>Адрес</label><input id="sAddress" value="${escapeHtml(s.address||'')}"></div>
    <div class="field"><label>Режим работы (как видят клиенты)</label><input id="sHours" value="${escapeHtml(s.workHoursText||'')}" placeholder="10:00 — 02:00"></div>
    <button class="btn primary full" onclick="saveSettings()">Сохранить тексты</button>

    <div class="section-title">Работаем дольше сегодня</div>
    <div class="card">
      ${s.lateActive?`<p>⏳ Действует до ${escapeHtml(s.lateUntilLabel||'')}${s.lateNote?': '+escapeHtml(s.lateNote):''}</p><button class="btn danger full" style="margin-top:8px" onclick="clearLate()">Снять продление</button>`:`
      <div class="field"><label>Сообщение для клиентов</label><input id="lateNote" placeholder="Сегодня работаем до 3:00"></div>
      <div class="row"><button class="btn ghost" onclick="extendLate(60)">+1 час</button><button class="btn ghost" onclick="extendLate(120)">+2 часа</button><button class="btn ghost" onclick="extendLate(180)">+3 часа</button></div>
      `}
    </div>

    <div class="section-title">Фото приветствия</div>
    <div class="card">${s.welcomePhoto?`<div class="photo-thumb"><img src="${s.welcomePhoto}"></div>`:'<div class="photo-thumb">Нет фото</div>'}<input type="file" accept="image/*" onchange="uploadWelcomePhoto(this)"></div>

    <div class="section-title">Фото столов</div>
    ${resourcesHtml||'<div class="empty">Столов пока нет</div>'}
  ${tabsHtml()}`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));icons();
}
async function saveSettings(){
  const payload={name:document.querySelector('#sName').value.trim(),phone:document.querySelector('#sPhone').value.trim(),address:document.querySelector('#sAddress').value.trim(),workHoursText:document.querySelector('#sHours').value.trim()};
  const r=await api('settings_update',payload);
  if(r.ok)toast('Сохранено');else toast('Не удалось сохранить')
}
async function extendLate(minutes){
  const note=document.querySelector('#lateNote')?.value.trim()||'';
  const r=await api('settings_extend',{minutes,note});
  if(r.ok){toast('Продлено');renderSettings()}else toast('Не удалось')
}
async function clearLate(){const r=await api('settings_clear_late');if(r.ok){toast('Продление снято');renderSettings()}}
async function uploadWelcomePhoto(input){
  let photoBase64=null;
  try{photoBase64=await readFile(input)}catch(_){toast('Файл слишком большой');return}
  if(!photoBase64)return;
  toast('Загружаем…');
  const r=await api('settings_set_welcome_photo',{photoBase64});
  if(r.ok){toast('Фото обновлено');renderSettings()}else toast('Не удалось загрузить')
}

boot();
</script>
