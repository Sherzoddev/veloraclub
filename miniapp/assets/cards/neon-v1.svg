    <radialGradient id="sunGlow" cx="600" cy="170" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="560"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="560"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="below"><rect x="0" y="232" width="800" height="200"/></clipPath>
  </defs>
  <rect width="800" height="360" fill="url(#sky)"/>
