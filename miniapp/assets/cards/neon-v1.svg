<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07021a"/>
      <stop offset=".6" stop-color="#1f0638"/>
      <stop offset="1" stop-color="#34084a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66b"/>
      <stop offset=".45" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff2e9a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#060110"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="800" height="360" fill="url(#fadeX)"/></mask>
    <mask id="sunCut">
      <rect width="800" height="360" fill="#fff"/>
      <g fill="#000"><rect x="480" y="150.0" width="240" height="2.0"/><rect x="480" y="164.9" width="240" height="3.1"/><rect x="480" y="181.6" width="240" height="4.2"/><rect x="480" y="200.1" width="240" height="5.3"/><rect x="480" y="220.4" width="240" height="6.4"/><rect x="480" y="242.5" width="240" height="7.5"/><rect x="480" y="266.4" width="240" height="8.6"/></g>
