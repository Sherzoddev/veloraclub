async function showMatch(){mtStop();stopChatPoll();document.querySelector('.sheet-card').classList.remove('chat-mode');if(!document.querySelector('#sheet').classList.contains('open'))openSheet(pageHead(t('mt_title'),true)+'<div class="skeleton"></div><div class="skeleton"></div>');const r=await api('match_board');if(r.error){document.querySelector('#sheetBody').innerHTML=pageHead(t('mt_title'),true)+`<div class="empty">${t('mt_need_card')}${state.boot?.authenticated===false?'':`<br><br><button class="cta" onclick="shareContact()">${t('share_contact')}</button>`}</div>`;icons();return}state.mtBoard=r;paintMatch();state.mtPoll=setInterval(pollMatch,5000)}
async function pollMatch(){if(!document.querySelector('#mtBoard'))return mtStop();if(document.hidden||state.mtBusy)return;state.mtBusy=true;try{const r=await api('match_board');if(!r.error&&JSON.stringify(r)!==JSON.stringify(state.mtBoard)){const was=state.mtBoard;state.mtBoard=r;paintMatch();if(was?.mine?.status==='OPEN'&&r.mine?.status==='MATCHED')notify('success')}}finally{state.mtBusy=false}}
function vsHero(title,other,playAt,level,actions){const me=state.boot?.me||{};return `<div class="mt-hero"><h2>${title}</h2><div class="vs"><div><div class="av">${initialOf(me.name)}</div><small>${t('mt_you')}</small></div><b>VS</b><div><div class="av them">${initialOf(other.name)}</div><small>${escapeHtml(other.name)}</small></div></div><p>${escapeHtml(other.name)} · ${visitsText(other.visits)}</p><div class="mt-meta"><span class="pill">🕗 ${mtWhen(playAt)}</span><span class="pill lv-${level}">${mtLevel(level)}</span></div><div class="mt-actions">${actions}</div></div>`}
function paintMatch(){const b=state.mtBoard||{},mine=b.mine,playing=b.playing,open=b.open||[];const write=id=>`<button class="cta" onclick="openMatchThread('${id}')"><i data-lucide="message-circle"></i> ${t('mt_write')}${b.unread?` · ${b.unread}`:''}</button>`;let hero;if(mine&&mine.status==='MATCHED'&&mine.opponent)hero=vsHero(t('mt_found'),mine.opponent,mine.play_at,mine.level,write(mine.id)+`<button class="ghost-btn" onclick="mtAction('match_cancel','${mine.id}','mt_confirm_cancel_game')">${t('mt_cancel_game')}</button>`);else if(mine)hero=`<div class="mt-hero"><div class="radar">🎱</div><h2>${t('mt_searching')}</h2><p>${t('mt_searching_sub')}</p><div class="mt-meta"><span class="pill">🕗 ${mtWhen(mine.play_at)}</span><span class="pill lv-${mine.level}">${mtLevel(mine.level)}</span></div>${mine.comment?`<p style="margin-bottom:14px">«${escapeHtml(mine.comment)}»</p>`:''}<div class="mt-actions"><button class="ghost-btn" onclick="mtAction('match_cancel','${mine.id}','mt_confirm_cancel')">${t('mt_cancel_request')}</button></div></div>`;else if(playing)hero=vsHero(t('mt_you_play'),playing.creator,playing.play_at,playing.level,write(playing.id)+`<button class="ghost-btn" onclick="mtAction('match_leave','${playing.id}','mt_confirm_leave')">${t('mt_leave')}</button>`);else hero=`<button class="cta" style="margin-top:6px" onclick="showMatchForm()"><i data-lucide="plus"></i> ${t('mt_create')}</button><p class="subtle" style="text-align:center;margin:9px 0 0">${t('mt_create_hint')}</p>`;const list=open.length?open.map(r=>`<div class="mt-card"><div class="av">${initialOf(r.name)}</div><div class="grow"><b>${escapeHtml(r.name)}</b> <small>· ${visitsText(r.visits)}</small><div class="mt-meta"><span class="pill">🕗 ${mtWhen(r.play_at)}</span><span class="pill lv-${r.level}">${mtLevel(r.level)}</span></div>${r.comment?`<q>${escapeHtml(r.comment)}</q>`:''}</div><button class="play-btn" onclick="mtAccept('${r.id}',this)">${t('mt_play')}</button></div>`).join(''):`<div class="empty">${t('mt_empty')}</div>`;document.querySelector('#sheetBody').innerHTML=pageHead(t('mt_title'),true)+`<div id="mtBoard">${hero}<div class="mt-section"><h3>${t('mt_list_title')}</h3>${open.length?`<span class="pill">${open.length}</span>`:''}</div>${list}</div>`;icons()}
function mtConfirm(key){return new Promise(res=>{if(tg?.showConfirm){try{tg.showConfirm(t(key),ok=>res(!!ok));return}catch(_){}}res(window.confirm(t(key)))})}
async function mtAction(action,id,confirmKey){if(confirmKey&&!(await mtConfirm(confirmKey)))return;haptic();const r=await api(action,{id});if(r.ok)notify('success');else toast(mtReason(r.reason||'CLOSED'));await showMatch()}
async function mtAccept(id,btn){btn.disabled=true;haptic('medium');const r=await api('match_accept',{id});if(r.ok){notify('success');toast(t('mt_accepted'),t('mt_accepted_sub'))}else{notify('error');toast(mtReason(r.reason))}await showMatch()}
function showMatchForm(){mtStop();const hours=[];const now=new Date();for(let i=1;i<=6;i++){const d=new Date(now);d.setMinutes(0,0,0);d.setHours(now.getHours()+i);hours.push(`${String(d.getHours()).padStart(2,'0')}:00`)}state.mtForm={when:'now',level:'MIDDLE'};document.querySelector('#sheetBody').innerHTML=`<div class="page-head"><button class="icon-btn" onclick="showMatch()"><i data-lucide="chevron-left"></i></button><h1>${t('mt_new')}</h1><div class="spacer"></div></div><div class="mt-form"><label>🕗 ${t('mt_when')}</label><div class="chips" id="mtWhen">${[['now','⚡ '+t('mt_now_btn')],...hours.map(h=>[h,h])].map(([v,l])=>`<button data-v="${v}" class="${v==='now'?'active':''}">${l}</button>`).join('')}</div><label>🎯 ${t('mt_level')}</label><div class="chips levels" id="mtLevel">${Object.keys(MT_LEVELS).map(k=>`<button data-v="${k}" class="${k==='MIDDLE'?'active':''}">${mtLevel(k)}</button>`).join('')}</div><label>💬 ${t('mt_comment')}</label><input id="mtComment" maxlength="200" placeholder="${t('mt_comment_ph')}"><button class="cta" style="margin-top:24px" id="mtPublish" onclick="publishMatch()">📣 ${t('mt_publish')}</button><p class="subtle" style="text-align:center;margin-top:10px">${t('mt_publish_hint')}</p></div>`;icons();for(const [box,key] of [['#mtWhen','when'],['#mtLevel','level']])document.querySelectorAll(`${box} button`).forEach(btn=>btn.onclick=()=>{state.mtForm[key]=btn.dataset.v;document.querySelectorAll(`${box} button`).forEach(x=>x.classList.toggle('active',x===btn));haptic()})}
async function publishMatch(){const btn=document.querySelector('#mtPublish');btn.disabled=true;const r=await api('match_create',{when:state.mtForm.when,level:state.mtForm.level,comment:document.querySelector('#mtComment')?.value||''});if(r.ok){notify('success');toast(t('mt_published'),t('mt_published_sub'));await showMatch()}else{btn.disabled=false;notify('error');toast(mtReason(r.reason))}}
// Thread with the opponent: same look as the club chat; messages are relayed
// to their Telegram with reply buttons, so they can answer from either side.
async function openMatchThread(id){mtStop();const r=await api('match_thread',{id});if(!r.ok){toast(mtReason(r.reason||'NOT_MATCHED'));return showMatch()}state.mtThread={id,other:r.other||{name:'?'},msgs:r.messages||[]};state.mtThread.sig=chatSig(state.mtThread.msgs);if(state.mtBoard)state.mtBoard.unread=0;document.querySelector('.sheet-card').classList.add('chat-mode');const o=state.mtThread.other;document.querySelector('#sheetBody').innerHTML=`<div class="chat-head"><button class="icon-btn" onclick="showMatch()"><i data-lucide="chevron-left"></i></button><div class="chat-ava them">${initialOf(o.name)}</div><div class="grow"><b>${escapeHtml(o.name)}</b><small>${t('mt_thread_sub')}</small></div></div><div id="chatScroll" class="chat-scroll"></div><div class="chat-bar"><textarea id="chatInput" rows="1" placeholder="${t('chat_placeholder')}" maxlength="1000"></textarea><button id="chatSend" onclick="sendMatchMessage()" disabled><i data-lucide="send-horizontal"></i></button></div>`;icons();const input=document.querySelector('#chatInput');input.oninput=()=>{input.style.height='44px';input.style.height=Math.min(input.scrollHeight+2,128)+'px';document.querySelector('#chatSend').disabled=!input.value.trim()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMatchMessage()}};paintMatchThread('bottom');state.mtPoll=setInterval(pollMatchThread,2500);window.visualViewport?.addEventListener('resize',onChatViewportResize)}
function paintMatchThread(scroll='keep'){const th=state.mtThread;if(!th)return;paintList(th.msgs.length?chatHtml(th.msgs,m=>!!m.mine,'retryMatchMessage'):`<div class="chat-empty"><div class="big">🎱</div>${t('mt_thread_empty')}</div>`,scroll)}
async function pollMatchThread(){const th=state.mtThread;if(!th||!document.querySelector('#chatScroll'))return mtStop();if(document.hidden||state.mtBusy)return;state.mtBusy=true;try{const r=await api('match_thread',{id:th.id});if(state.mtThread!==th)return;if(!r.ok){if(r.reason==='NOT_MATCHED'){toast(t('mt_err_NOT_MATCHED'));showMatch()}return}const sig=chatSig(r.messages||[]);if(sig===th.sig)return;const known=new Set(r.messages.map(m=>m.id));const before=th.msgs.filter(m=>!m._local).length;const keep=th.msgs.filter(m=>!known.has(m.id)&&(m._local||Date.now()-new Date(m.created_at).getTime()<20000));const fresh=r.messages.length>before&&!r.messages[r.messages.length-1]?.mine;th.msgs=[...r.messages,...keep].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));th.sig=sig;paintMatchThread(fresh?'auto':'keep');if(fresh)haptic('light')}finally{state.mtBusy=false}}
async function sendMatchMessage(){const th=state.mtThread,input=document.querySelector('#chatInput');const message=(input?.value||'').trim().slice(0,1000);if(!th||!message)return;input.value='';input.oninput();haptic('light');const local={id:'local-'+Date.now(),mine:true,body:message,created_at:new Date().toISOString(),_local:true};th.msgs.push(local);paintMatchThread('bottom');await deliverMatchMessage(th,local)}
async function deliverMatchMessage(th,local){const r=await api('match_send',{id:th.id,message:local.body});const i=th.msgs.findIndex(m=>m.id===local.id);if(i<0)return;if(r.ok&&r.message){th.msgs[i]=r.message;th.sig=chatSig(th.msgs.filter(m=>!m._local))}else{th.msgs[i]={...local,_failed:true};notify('error');toast(mtReason(r.reason||'NOT_MATCHED'))}if(state.mtThread===th)paintMatchThread('keep')}
function retryMatchMessage(id){const th=state.mtThread;const m=th?.msgs.find(x=>x.id===id);if(!m)return;m._failed=false;paintMatchThread('keep');deliverMatchMessage(th,m)}
function showSettings(){openSheet(`${pageHead(t('settings_title'),true)}<div class="panel"><div class="panel-row"><i data-lucide="bell"></i><div class="grow"><b>${t('settings_notifications')}</b><small>${t('settings_notifications_sub')}</small></div></div><div class="panel-row"><i data-lucide="languages"></i><div class="grow"><b>${t('settings_lang')}</b><div class="lang-picker" style="margin-top:8px"><button data-lang="ru" class="${state_lang==='ru'?'active':''}">Русский</button><button data-lang="uz" class="${state_lang==='uz'?'active':''}">Oʻzbekcha</button></div></div></div><div class="panel-row" onclick="toast('Velora Club','${t('about_toast')}')"><i data-lucide="info"></i><div class="grow"><b>${t('settings_about')}</b></div><i data-lucide="chevron-right"></i></div></div>`);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang))}
function setLang(lang){if(lang===state_lang)return;state_lang=lang;try{localStorage.setItem('velora.lang',lang)}catch(_){}applyStaticText();haptic();if(state.tab==='tables')renderTables(false);if(state.tab==='club')renderClub();if(state.tab==='profile')renderProfile();if(state.tab==='home')renderHome();showSettings()}
function statusLabel(s){return({pending:t('status_pending'),confirmed:t('status_confirmed'),arrived:t('status_arrived'),completed:t('status_completed'),cancelled:t('status_cancelled'),no_show:t('status_noshow')})[s]||s}
function openSheet(html){document.querySelector('.sheet-card').classList.remove('chat-mode');document.querySelector('#sheetBody').innerHTML=html;document.querySelector('#sheet').classList.add('open');tg?.BackButton?.show();tg?.BackButton?.onClick(closeSheet);icons()}
function closeSheet(){document.querySelector('#sheet').classList.remove('open');document.querySelector('.sheet-card').classList.remove('chat-mode');tg?.BackButton?.hide();stopChatPoll();mtStop();state.mtThread=null}
function closeSuccess(){document.querySelector('#success').classList.remove('open')}
function toast(title,body=''){const e=document.querySelector('#toast');e.innerHTML=`<b>${escapeHtml(title)}</b>${body?`<small>${escapeHtml(body)}</small>`:''}`;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
function shareContact(){if(tg?.requestContact){tg.requestContact(ok=>{if(ok){toast(t('contact_sent'),t('contact_sent_sub'));setTimeout(()=>bootstrap(true),1500)}})}else toast(t('open_in_telegram'),t('open_in_telegram_sub'))}
async function joinWaitlist(family){const r=await api('waitlist',{family});if(r.ok){notify('success');toast(r.existing?t('waitlist_already'):t('waitlist_added'),t('waitlist_hint'))}else toast(t('waitlist_fail'),t('waitlist_fail_sub'))}
function switchTab(tab){state.tab=tab;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===tab));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));haptic();if(tab==='tables')renderTables();if(tab==='club')renderClub();if(tab==='profile')renderProfile()}
async function bootstrap(silent=false){setupTelegram();if(!clubId){startupError(t('open_app_hint'));return}if(!silent&&!state.boot&&telegramInitData()){try{const cached=JSON.parse(localStorage.getItem(BOOT_CACHE)||'null');if(cached&&Date.now()-cached.savedAt<300000){state.boot=cached.data;applyDesign();renderHome();hideLoader()}}catch(_){}}const oldTier=state.boot?.me?.tier_id;const r=await api('bootstrap');if(r.error){if(state.boot){hideLoader();toast(t('update_fail'),t('showing_cached'));return}startupError(r.error==='timeout'?t('timeout_err'):t('startup_default'));return}if(silent&&state.boot&&JSON.stringify(state.boot)===JSON.stringify(r))return;state.boot=r;applyDesign();try{if(r.authenticated)localStorage.setItem(BOOT_CACHE,JSON.stringify({savedAt:Date.now(),data:r}))}catch(_){}if(r.authenticated&&r.termsAccepted===false){showTermsGate();hideLoader();return}if(r.club&&r.club.isOpen===false){showClosedScreen(r);hideLoader();openChatDeepLink(silent);return}document.querySelector('.nav').style.display='';renderHome();if(state.tab==='club')renderClub();if(state.tab==='profile')renderProfile();hideLoader();if(!state.resources.length)api('resources').then(x=>{if(x.resources)state.resources=x.resources});if(!silent&&r.levelUp&&r.me?.hasCard&&!params.get('chat')&&!params.get('match'))showLevelUp();if(oldTier&&oldTier!==r.me?.tier_id)showLevelUp();openChatDeepLink(silent)}
// Opened from "💬 Открыть чат" under a club message in Telegram: straight
// into the thread, once, even while the club is closed.
// Same for "📱 Открыть в приложении" under a find-an-opponent message.
function openChatDeepLink(silent){if(silent||state.chatDeepLinkDone||!state.boot?.authenticated)return;if(params.get('chat')==='1'){state.chatDeepLinkDone=true;showChat()}else if(params.get('match')==='1'){state.chatDeepLinkDone=true;showMatch()}}
function showTermsGate(){const home=document.querySelector('#home');const ru=state_lang!=='uz';document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const nav=document.querySelector('.nav');if(nav)nav.style.display='none';if(home){home.innerHTML=`<div class="empty" style="margin-top:10vh;text-align:left"><b style="display:block;text-align:center;margin-bottom:10px">${ru?'📋 Пользовательское соглашение':'📋 Foydalanuvchi shartnomasi'}</b><p>${ru?'Прежде чем пользоваться приложением, ознакомьтесь с условиями:':'Ilovadan foydalanishdan oldin shartlarga tanishib chiqing:'}</p><p>${ru?'• Для брони, карты клиента и бонусов сохраняются ваше имя, номер телефона и Telegram ID.':'• Bron qilish, mijoz kartasi va bonuslar uchun ismingiz, telefon raqamingiz va Telegram ID\'ingiz saqlanadi.'}</p><p>${ru?'• Эти данные используются только для обслуживания в этом клубе и не передаются третьим лицам.':'• Bu ma\'lumotlar faqat shu klub ichida xizmat ko\'rsatish uchun ishlatiladi va uchinchi shaxslarga berilmaydi.'}</p><p>${ru?'• Продолжая пользоваться приложением, вы соглашаетесь с этими условиями.':'• Ilovadan foydalanishni davom ettirish shartlarga roziligingizni bildiradi.'}</p><button class="cta" id="termsAcceptBtn" style="margin-top:16px" onclick="acceptTerms()">${ru?'✅ Согласен, продолжить':'✅ Roziman, davom etish'}</button></div>`;home.classList.add('active');home.querySelector('.empty').style.maxWidth='420px';home.querySelector('.empty').style.marginLeft='auto';home.querySelector('.empty').style.marginRight='auto'}icons()}
async function acceptTerms(){const btn=document.querySelector('#termsAcceptBtn');if(btn){btn.disabled=true;btn.textContent=state_lang==='uz'?'...':'...'}const r=await api('accept_terms');if(r.ok){await bootstrap(false)}else if(btn){btn.disabled=false}}
function showClosedScreen(r){const home=document.querySelector('#home');const hours=r.club.hours||'10:00 — 02:00';document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));if(home){home.innerHTML=`<div class="empty" style="margin-top:26vh"><i data-lucide="moon-star"></i><br><b>${state_lang==='uz'?'Klub hozir yopiq':'Клуб сейчас закрыт'}</b><p>${state_lang==='uz'?'Ish vaqti':'Режим работы'}: ${escapeHtml(hours)}</p><button class="cta" style="margin-top:14px" onclick="bootstrap(false)">${t('retry')}</button></div>`;home.classList.add('active')}const nav=document.querySelector('.nav');if(nav)nav.style.display='none';icons()}
function showLevelUp(){const me=state.boot.me,e=document.querySelector('#levelup');e.innerHTML=`<div><p>${t('levelup_title')}</p><h2>${t('levelup_became')} ${escapeHtml(me.tier)}</h2>${memberCard(me,false)}<button class="cta" style="width:min(360px,86vw);margin:22px auto 0" onclick="ackLevel()">${t('great')}</button></div>`;e.classList.add('open');notify('success');icons()}
async function ackLevel(){document.querySelector('#levelup').classList.remove('open');await api('ack_level')}
applyStaticText();
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>switchTab(x.dataset.tab));document.querySelector('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};setInterval(()=>{if(!document.hidden&&state.boot)bootstrap(true)},15000);waitForInitData(1500).then(()=>bootstrap());icons();
</script>
</body>
</html>
